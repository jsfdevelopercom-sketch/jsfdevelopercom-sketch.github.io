name: One-time AI DOC desktop layout patch

on:
  push:
    branches: [hotfix-aidoc-fullwidth-20260911]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[aidoc-layout-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix-aidoc-fullwidth-20260911
          fetch-depth: 0
      - name: Patch AI DOC host grid
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '<section id="panelAiDoc" class="cards-flow" aria-label="AI Doc tab content" style="display:none; height: 1px; min-height: 0; overflow: hidden;">'
          new = '<section id="panelAiDoc" class="cards-flow" aria-label="AI Doc tab content" style="display:none; grid-column:1 / -1; grid-template-columns:minmax(0,1fr); width:100%; max-width:none; height:1px; min-height:0; overflow:hidden;">'
          if old not in s:
              raise SystemExit('Expected AI DOC section marker not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
      - name: Remove one-time workflow and commit patch
        run: |
          rm -f .github/workflows/patch-aidoc-layout.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix AI DOC desktop iframe full-width layout [aidoc-layout-patched]"
          git push origin HEAD:hotfix-aidoc-fullwidth-20260911
